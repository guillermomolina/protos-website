name: Publish production image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-production-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout website repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive OCI metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Protos Website

      - name: Build and publish production image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record immutable production reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid published manifest digest: $DIGEST" >&2
            exit 1
          fi

          immutable_ref="${IMAGE_NAME}@${DIGEST}"

          {
            echo "### WEB001-H production image"
            echo
            echo '```text'
            echo "$immutable_ref"
            echo '```'
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo
            echo "Deployment authority: **manifest digest**."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "IMMUTABLE_IMAGE_REF=$immutable_ref" >> "$GITHUB_ENV"

      - name: Verify public immutable manifest
        shell: bash
        run: |
          set -euo pipefail

          docker logout ghcr.io

          manifest_file="$(mktemp)"
          found=0
          for attempt in $(seq 1 12); do
            if docker buildx imagetools inspect --raw "$IMMUTABLE_IMAGE_REF" > "$manifest_file"; then
              found=1
              break
            fi
            sleep 5
          done

          if [[ "$found" != 1 ]]; then
            echo "Published manifest is not anonymously readable: $IMMUTABLE_IMAGE_REF" >&2
            exit 1
          fi

          python3 - "$manifest_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as stream:
              index = json.load(stream)

          platforms = {
              (
                  manifest.get("platform", {}).get("os"),
                  manifest.get("platform", {}).get("architecture"),
              )
              for manifest in index.get("manifests", [])
          }

          required = {
              ("linux", "amd64"),
              ("linux", "arm64"),
          }

          missing = required - platforms
          if missing:
              raise SystemExit(
                  "Published image is missing required platforms: "
                  + ", ".join("%s/%s" % pair for pair in sorted(missing))
              )

          print("ANONYMOUS_GHCR_READ: PASS")
          print("PUBLISHED_PLATFORMS: PASS linux/amd64 linux/arm64")
          PY
